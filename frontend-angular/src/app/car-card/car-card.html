<div class="card">
  <div class="card__img-wrapper">
    <img [src]="car.fotos[0]" [alt]="car.modelo" class="card__img">
    <span class="card__badge">{{ car.ano }}</span>
  </div>

  <div class="card__content">
    <h3 class="card__nome">{{ car.marca }} {{ car.modelo }}</h3>

    <div class="card__info">
      <span class="card__info-item">🗓 {{ car.ano }}</span>
      <span class="card__info-item">⏱ {{ car.km | number:'1.0-0' }} km</span>
    </div>

    <div class="card__rodape">
      <span class="card__preco">{{ car.preco | currency:'BRL':'symbol':'1.0-0' }}</span>
      <span class="card__combustivel">{{ car.combustivel }}</span>
    </div>

    <button class="card__btn" (click)="verDetalhes()">Ver detalhes</button>
  </div>
</div>
